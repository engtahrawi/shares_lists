name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode release keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets are missing, so only a debug check build runs and no release is published. See README.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Check build (no signing key)
        if: steps.keystore.outputs.signed != 'true'
        run: gradle assembleDebug --no-daemon

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        if: steps.keystore.outputs.signed == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk WelcomeAbdallah.apk

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: WelcomeAbdallah-apk
          path: WelcomeAbdallah.apk

      - name: Publish release
        if: steps.keystore.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Welcome Abdallah build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: WelcomeAbdallah.apk

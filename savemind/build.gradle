plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (GitHub Actions secrets).
// The keystore itself is never committed to this public repository.
def releaseKeystore = System.getenv('RELEASE_KEYSTORE_PATH')

android {
    namespace 'com.abdallah.savemind'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abdallah.savemind'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
